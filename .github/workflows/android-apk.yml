name: Android phone test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run check
      - run: npx expo prebuild --platform android --no-install
      - name: Build standalone test APK (development signing certificate)
        working-directory: client/android
        run: bash ./gradlew :app:assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=2
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: notes-phone-test-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
